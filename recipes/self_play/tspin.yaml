# T-SPIN: Triplet Self-Play Fine-Tuning
name: tspin_self_play
models:
  student: {path: Qwen/Qwen2.5-1.5B, dtype: bf16}
data:
  max_length: 1024
  eval:
    type: hf_dataset
    path: UCLA-AGI/SPIN_iter0
    split: test
    limit: 200
pipeline:
  - stage: prepare_dataset
    name: prepare
    source: {type: hf_dataset, path: UCLA-AGI/SPIN_iter0, split: train}
    transforms:
      - {type: tokenize_listwise, max_prompt_length: 512, max_length: 1024}
    dataset: true
producer: {type: listwise, pad_groups_to: 3}
teacher: {provider: none, input: same}
loss:
  terms:
    - {criterion: tspin, weight: 1.0, params: {alpha: 1.0, beta: 0.1}}
train: {output_dir: outputs/self_play/tspin, batch_size: 15, micro_batch_size: 3}
optim: {lr: 5e-7}
callbacks:
  - type: evaluate
    every: epoch
    load_best_at_end: true
  - type: checkpoint
    every: epoch
    keep_best: 1
    metric: dev_loss/loss
    mode: min
eval:
  - type: dev_loss
    when: epoch
    data:
      type: hf_dataset
      path: UCLA-AGI/SPIN_iter0
      split: test
      limit: 200

