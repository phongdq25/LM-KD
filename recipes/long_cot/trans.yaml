name: long_cot_trans
models:
  student:
    path: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
data:
  max_length: 32768
pipeline:
- stage: prepare_dataset
  name: prepare
  source:
    type: jsonl
    path: data/train.jsonl
  transforms:
  - type: render_cot
  - type: tokenize_cot
- stage: build_weights
  name: weights
  inputs:
    data: prepare
  chain:
  - type: step_transitions
    min_step_tokens: 8
  dataset: true
loss:
  terms:
  - criterion: nll
    weight: 1.0
  - criterion: transition_loss
    weight: 0.3
    params:
      warmup_ratio: 0.1
optim:
  lr: 5.0e-05
  groups:
  - name: trans_predictor
    match:
      owner: modules
      group: trans_predictor
    lr: 0.0002
    weight_decay: 0.0
  - name: no_decay
    match:
      ndim_le: 1
    weight_decay: 0.0
  - name: default
    match: {}
  schedulers:
  - type: cosine
    warmup_ratio: 0.1
    min_lr_ratio: 0.2
  weight_decay: 0.0
  optimizers:
    default:
      type: adamw
train:
  output_dir: outputs/long_cot/trans
  epochs: 3
  batch_size: 32
  micro_batch_size: 1
  seed: 42
  log_every: 10
producer: dataset
algorithm: standard
step: standard
grad:
  clip_norm: 1.0
engine:
  type: local
  device: auto
  mixed_precision: bf16
