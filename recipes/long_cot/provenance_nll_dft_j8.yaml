_base_: provenance_nll_dft.yaml
name: long_cot_provenance_nll_dft_j8
pipeline:
- stage: prepare_dataset
  name: prepare
  source:
    type: hf_dataset
    path: simplescaling/s1K-1.1
    split: train
  transforms:
  - type: render_cot
  - type: tokenize_cot
- stage: build_weights
  name: weights
  inputs:
    data: prepare
  chain:
  - type: provenance
    junction_tokens: 8
  dataset: true
train:
  output_dir: outputs/long_cot/provenance_nll_dft_j8
callbacks:
- type: evaluate
  every: epoch
  load_best_at_end: true
- type: checkpoint
  every: epoch
  keep_best: 1
  metric: dev_loss/loss
  mode: min
eval:
- type: dev_loss
  when: epoch
  data:
    type: hf_dataset
    path: simplescaling/s1K-1.1
    split: train
    limit: 50
- type: math_passk
  name: math
  when: end
  benchmarks:
  - aime25
  - aime24
  - amc12
  - math500
  n: 8
  ks:
  - 1
  - 3
  grader: math_verify
