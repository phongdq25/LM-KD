name: long_cot_sft_packed
models:
  student:
    path: Qwen/Qwen3-0.6B
    dtype: bf16
    task: causal_lm
    attn_implementation: flash_attention_2
data:
  train:
    type: hf_dataset
    path: simplescaling/s1K-1.1
    split: train
  transforms:
  - type: tokenize_sft
    use_chat_template: true
    chat_template_kwargs:
      enable_thinking: false
  max_length: 16384
  packing: true
  eval:
    type: hf_dataset
    path: simplescaling/s1K-1.1
    split: train
    limit: 50
producer:
  type: packed_dataset
  max_tokens: 16384
algorithm: standard
step:
  type: standard
loss:
  terms:
  - criterion: nll
optim:
  lr: 2.0e-05
  weight_decay: 0.0
  groups:
  - name: no_decay
    match:
      ndim_le: 1
    weight_decay: 0.0
  - name: default
    match: {}
  optimizers:
    default:
      type: adamw
  schedulers:
  - type: cosine
    warmup_ratio: 0.03
    min_lr_ratio: 0.1
grad:
  clip_norm: 1.0
engine:
  type: local
  device: auto
  mixed_precision: bf16
train:
  output_dir: outputs/long_cot_sft_packed
  epochs: 3
  batch_size: 8
  micro_batch_size: 1
  seed: 42
  log_every: 10
callbacks:
- type: evaluate
  every: epoch
  load_best_at_end: true
- type: checkpoint
  every: epoch
  keep_best: 1
  metric: dev_loss/loss
  mode: min
eval:
- type: dev_loss
  when: epoch
  data:
    type: hf_dataset
    path: simplescaling/s1K-1.1
    split: train
    limit: 50
- type: math_passk
  name: math
  when: end
  benchmarks:
  - aime25
  - aime24
  - amc12
  - math500
  n: 8
  ks:
  - 1
  - 3
  grader: math_verify
