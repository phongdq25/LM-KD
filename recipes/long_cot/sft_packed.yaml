# Long-CoT SFT with FlashAttention-2 packing. batch_size counts packed rows.
name: long_cot_sft_packed

models:
  student:
    path: Qwen/Qwen3-0.6B
    dtype: bf16
    task: causal_lm
    attn_implementation: flash_attention_2

data:
  train:
    type: jsonl
    path: data/train.jsonl
  transforms:
    - type: tokenize_sft
      use_chat_template: true
      chat_template_kwargs: {enable_thinking: false}
  max_length: 16384
  packing: true

producer:
  type: packed_dataset
  max_tokens: 16384

algorithm: standard
step:
  type: standard

loss:
  terms:
    - criterion: nll

optim:
  lr: 2.0e-5
  weight_decay: 0.0
  groups:
    - name: no_decay
      match: {ndim_le: 1}
      weight_decay: 0.0
    - name: default
      match: {}
  optimizers:
    default:
      type: adamw
  schedulers:
    - type: cosine
      warmup_ratio: 0.03
      min_lr_ratio: 0.1

grad:
  clip_norm: 1.0

engine:
  type: local
  device: auto
  mixed_precision: bf16

train:
  output_dir: outputs/long_cot_sft_packed
  epochs: 3
  batch_size: 8
  micro_batch_size: 1
  seed: 42
  log_every: 10
