name: luffy_native
models:
  student:
    path: Qwen/Qwen3-1.7B
    dtype: bf16
    task: causal_lm
    gradient_checkpointing: true
data:
  train:
    type: hf_dataset
    path: open-thoughts/OpenThoughts-114k
    name: metadata
    split: train
    filter:
      domain: math
  eval:
    type: hf_dataset
    path: open-thoughts/OpenThoughts-114k
    name: metadata
    split: train
    filter:
      domain: math
    limit: 100
  transforms:
  - type: tokenize_prompt
    template: 'Problem: {problem}

      Please reason step by step, and put your final answer within \boxed{{}}.'
  max_length: 20000
  padding: dynamic
  pad_to_multiple_of: 8
producer:
  type: luffy_group
  n: 8
  n_prefix: 1
  min_prefix_ratio: 1.0
  max_prefix_ratio: 1.0
  sampling:
    temperature: 1.0
    max_new_tokens: 16000
  verifier: math_verify
rollout:
  type: vllm_colocate
  gpu_memory_utilization: 0.3
teacher:
  provider: none
  input: same
algorithm:
  type: rl
  advantage:
    type: grpo_split
    norm_by_std: false
  adv_transforms:
  - type: luffy_prefix_weight
    alpha: 1.0
    beta: 1.0
step:
  type: ppo_epochs
  epochs: 1
  mini_batches: 1
loss:
  aggregator: weighted_sum
  terms:
  - criterion: luffy
    params:
      cliprange: 0.2
      clip_upper_bound: 1.0
      off_policy_reshape: p_div_p_0.1
      loss_remove_clip: true
      loss_remove_token_mean: true
optim:
  lr: 1.0e-06
  weight_decay: 0.0
  groups:
  - name: no_decay
    match:
      ndim_le: 1
    weight_decay: 0.0
  - name: default
    match: {}
  optimizers:
    default:
      type: adamw
  schedulers:
  - type: cosine
    warmup_ratio: 0.03
    min_lr_ratio: 0.1
grad:
  clip_norm: 1.0
engine:
  type: local
  device: auto
  mixed_precision: bf16
train:
  output_dir: outputs/luffy
  epochs: 1.0
  batch_size: 64
  micro_batch_size: 8
  seed: 42
  log_every: 10
callbacks:
- type: evaluate
  every: epoch
  load_best_at_end: true
- type: checkpoint
  every: epoch
  keep_best: 1
  metric: dev_loss/loss
  mode: min
eval:
- type: dev_loss
  when: epoch
  data:
    type: hf_dataset
    path: open-thoughts/OpenThoughts-114k
    name: metadata
    split: train
    filter:
      domain: math
    limit: 100
- type: math_passk
  name: math
  when: end
  benchmarks:
  - aime25
  - aime26
  - hmmt25
  n: 8
  ks:
  - 1
  - 3
  grader: math_verify
