_base_: opsd.yaml
name: opsd_tinker_qwen3_1.7b
loss:
  terms:
  - criterion: tinker_rkl
    alias: tinker
    params:
      temperature: 1.0
train:
  output_dir: outputs/opsd_tinker
callbacks:
- type: evaluate
  every: epoch
  load_best_at_end: true
- type: checkpoint
  every: epoch
  keep_best: 1
  metric: dev_loss/loss
  mode: min
eval:
- type: dev_loss
  when: epoch
  data:
    type: hf_dataset
    path: open-thoughts/OpenThoughts-114k
    name: metadata
    split: train
    filter:
      domain: math
    limit: 100
- type: math_passk
  name: math
  when: end
  benchmarks:
  - aime25
  - aime26
  - hmmt25
  n: 8
  ks:
  - 1
  - 3
  grader: math_verify
