_base_: opsd.yaml
name: opsd_reason_first_qwen3_1.7b
teacher:
  input:
    _delete_: true
    type: reason_first
    reasoning_template: 'Problem: {problem}


      Here is a correct reasoning to this problem:=== Reference Reasoning Start ===

      {solution}

      === Reference Reasoning End ===


      The reference reasoning above arrives at the correct answer. Please analyze
      this solution and explain the key reasoning steps and problem-solving strategies
      employed. Do NOT use <think> tags. Do NOT derive your own solution. Simply analyze
      and explain the reference solution provided above.

      '
    transition_template: '


      After reading the reference solution above, make sure you truly understand the
      reasoning behind each step — do not copy or paraphrase it. Now, using your own
      words and independent reasoning, derive the same final answer to the problem
      above. Think step by step, explore different approaches, and don''t be afraid
      to backtrack or reconsider if something doesn''t work out:


      Please reason step by step, and put your final answer within \boxed{{}}.'
    fields:
    - problem
    - solution
    sampling:
      temperature: 0.7
      max_new_tokens: 1024
train:
  output_dir: outputs/opsd_reason_first
callbacks:
- type: evaluate
  every: epoch
  load_best_at_end: true
- type: checkpoint
  every: epoch
  keep_best: 1
  metric: dev_loss/loss
  mode: min
eval:
- type: dev_loss
  when: epoch
  data:
    type: hf_dataset
    path: open-thoughts/OpenThoughts-114k
    name: metadata
    split: train
    filter:
      domain: math
    limit: 100
- type: math_passk
  name: math
  when: end
  benchmarks:
  - aime25
  - aime26
  - hmmt25
  n: 8
  ks:
  - 1
  - 3
  grader: math_verify
