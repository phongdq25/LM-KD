# Standard Math & Long-CoT evaluation mix (AIME25, AIME24, AMC12, MATH500). Include with _base_.
eval:
  - type: dev_loss
    when: epoch
    data:
      type: hf_dataset
      path: simplescaling/s1K-1.1
      split: train
      limit: 50
  - type: math_passk
    when: end
    name: math
    benchmarks:
      - aime25
      - aime24
      - amc12
      - math500
    n: 8
    ks: [1, 3]
    grader: math_verify
callbacks:
  - type: evaluate
    every: epoch
    load_best_at_end: true
  - type: checkpoint
    every: epoch
    keep_best: 1
    metric: dev_loss/loss
    mode: min
