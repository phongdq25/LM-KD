name: mol
models:
  student:
    path: nreimers/MiniLMv2-L6-H384-distilled-from-BERT-Base
    task: encoder
    dtype: fp32
    tokenizer: bert-base-uncased
    trainable: true
  teacher:
    path: Qwen/Qwen3-Embedding-0.6B
    task: encoder
    dtype: fp32
    trainable: false
data:
  train:
    type: csv
    path: datasets/embedding_data/train_full.csv
  transforms:
  - type: tokenize_text
    teacher: true
    keep_text: true
  max_length: 256
teacher:
  provider: hf_frozen
  input: pretokenized
producer:
  type: dataset
algorithm: standard
step:
  type: standard
loss:
  aggregator: weighted_sum
  terms:
  - criterion: simcse_unsupervised
    weight: 0.7
    params:
      temperature: 0.07
      pooler: cls
  - criterion: mol
    weight: 0.3
    params:
      student_layers:
      - -2
      - -1
      teacher_window: 2
optim:
  lr: 2.0e-05
  weight_decay: 0.01
  groups:
  - name: projector
    match:
      owner: modules
    lr: 2.0e-05
    weight_decay: 0.01
  - name: default
    match: {}
  optimizers:
    adamw:
      type: adamw
  schedulers:
  - type: cosine
    warmup_ratio: 0.06
grad:
  clip_norm: 1.0
engine:
  type: local
  device: auto
  mixed_precision: fp32
train:
  output_dir: outputs/mol
  epochs: 5
  batch_size: 16
  micro_batch_size: 16
  seed: 42
  log_every: 10
callbacks:
- type: evaluate
  every: epoch
  load_best_at_end: true
- type: checkpoint
  every: epoch
  keep_best: 1
  metric: dev/avg
  mode: max
eval:
- type: embedding_mteb
  when: epoch
  split: validation
  name: dev
- type: embedding_mteb
  when: end
  split: test
  name: test
