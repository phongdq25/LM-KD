name: jasper_stage1
models:
  student:
    path: nreimers/MiniLMv2-L6-H384-distilled-from-BERT-Large
    task: encoder
    dtype: fp32
    tokenizer: bert-base-uncased
    trainable: false
data:
  train:
    type: csv
    path: datasets/embedding_data/train_full.csv
  max_length: 256
pipeline:
- stage: prepare_dataset
  name: data
  source:
    type: csv
    path: datasets/embedding_data/train_full.csv
  transforms:
  - type: tokenize_text
    keep_text: true
  dataset: true
- stage: embed_teacher
  name: teacher_emb
  inputs:
    data: data
  model: Qwen/Qwen3-Embedding-0.6B
  pooling: last
teacher:
  provider:
    type: embedding_store
    node: teacher_emb
  input: same
producer:
  type: dataset
algorithm: standard
step:
  type: standard
loss:
  aggregator: weighted_sum
  terms:
  - criterion: jasper
    weight: 1.0
    params:
      teacher_dim: 1024
      pooler: cls
      w_cos: 1.0
      w_sim: 5.0
      w_tri: 1.0
optim:
  lr: 0.0001
  weight_decay: 0.01
  groups:
  - name: projector
    match:
      owner: modules
    lr: 0.0001
    weight_decay: 0.01
  optimizers:
    adamw:
      type: adamw
  schedulers:
  - type: cosine
    warmup_ratio: 0.06
grad:
  clip_norm: 1.0
engine:
  type: local
  device: auto
  mixed_precision: fp32
train:
  output_dir: outputs/jasper/stage1
  epochs: 2
  batch_size: 32
  micro_batch_size: 32
  seed: 42
  log_every: 10
callbacks:
- type: evaluate
  every: epoch
  load_best_at_end: true
- type: checkpoint
  every: epoch
  keep_best: 1
  metric: dev_loss/loss
  mode: min
eval:
- type: dev_loss
  when: epoch
  data:
    type: csv
    path: datasets/embedding_data/train_full.csv
    max_samples: 256
