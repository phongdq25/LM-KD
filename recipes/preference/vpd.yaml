# Score raw responses, then tokenize the scored artifact. vpd criterion is implemented in T22.
name: vpd_listwise
models:
  student: {path: meta-llama/Llama-3.2-1B-Instruct, dtype: bf16}
data:
  max_length: 2048
  eval:
    type: hf_dataset
    path: HuggingFaceH4/ultrafeedback_binarized
    split: test_prefs
    limit: 200
pipeline:
  - stage: prepare_dataset
    name: raw
    source: {type: hf_dataset, path: HuggingFaceH4/ultrafeedback_binarized, split: train_prefs}
  - stage: sample_candidates
    name: candidates
    inputs: {data: raw}
    model: meta-llama/Llama-3.2-1B-Instruct
    num_responses: 4
    temperature: 1.0
    top_p: 0.95
    max_new_tokens: 512
  - stage: score
    name: scores
    inputs: {data: candidates}
    mode: pad_mcq
    model: meta-llama/Llama-3.1-8B-Instruct
    out_field: teacher_scores
  - stage: prepare_dataset
    name: prepare
    source: {type: artifact_records, node: scores}
    transforms:
      - type: tokenize_listwise
        max_prompt_length: 1800
        max_length: 2048
        mcq_confidence_filter: true
    dataset: true
producer: {type: listwise, pad_groups_to: 4}
teacher: {provider: none, input: same}
loss:
  terms:
    - {criterion: vpd, weight: 1.0, params: {beta: 10.0}}
train: {output_dir: outputs/preference/vpd, batch_size: 64, micro_batch_size: 4}
optim: {lr: 8.0e-7}
callbacks:
  - type: evaluate
    every: epoch
    load_best_at_end: true
  - type: checkpoint
    every: epoch
    keep_best: 1
    metric: dev_loss/loss
    mode: min
eval:
  - type: dev_loss
    when: epoch
    data:
      type: hf_dataset
      path: HuggingFaceH4/ultrafeedback_binarized
      split: test_prefs
      limit: 200
  - type: lm_eval
    when: end
    name: preference
    tasks:
      - hellaswag
      - arc_challenge
      - truthfulqa_mc2
      - winogrande
      - gsm8k
    batch_size: auto
