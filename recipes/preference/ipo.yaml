name: ipo
models:
  student:
    path: models/student
    dtype: bf16
    task: causal_lm
  teacher:
    path: models/teacher
    dtype: bf16
    task: causal_lm
    placement: same_device
data:
  max_length: 1024
pipeline:
- stage: prepare_dataset
  name: prepare
  source:
    type: jsonl
    path: data/preference/train.jsonl
  transforms:
  - type: tokenize_listwise
    max_prompt_length: 512
    max_length: 1024
  dataset: true
producer:
  type: listwise
  pad_groups_to: 2
teacher:
  provider: hf_frozen
  input: same
algorithm: standard
step: standard
loss:
  aggregator: weighted_sum
  terms:
  - criterion: dpo
    weight: 1.0
    params:
      loss_type: ipo
      beta: 0.1
optim:
  lr: 1.0e-06
  weight_decay: 0.0
  groups:
  - name: no_decay
    match:
      ndim_le: 1
    weight_decay: 0.0
  - name: default
    match: {}
  optimizers:
    default:
      type: adamw
  schedulers:
  - type: cosine
    warmup_ratio: 0.03
    min_lr_ratio: 0.1
grad:
  clip_norm: 1.0
engine:
  type: local
  device: auto
  mixed_precision: bf16
train:
  output_dir: outputs/preference/ipo
  epochs: 1.0
  batch_size: 16
  micro_batch_size: 2
  seed: 42
  log_every: 10
