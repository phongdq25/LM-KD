name: ppd_listwise
models:
  student: {path: meta-llama/Llama-3.2-1B-Instruct, dtype: bf16}
data:
  max_length: 2048
  eval:
    type: hf_dataset
    path: HuggingFaceH4/ultrafeedback_binarized
    split: test_prefs
    limit: 200
pipeline:
  - stage: prepare_dataset
    name: raw
    source: {type: hf_dataset, path: HuggingFaceH4/ultrafeedback_binarized, split: train_prefs}
  - stage: score
    name: scores
    inputs: {data: raw}
    mode: sequence_logprob
    model: meta-llama/Llama-3.1-8B-Instruct
    out_field: teacher_scores
  - stage: prepare_dataset
    name: prepare
    source: {type: artifact_records, node: scores}
    transforms:
      - {type: tokenize_listwise, max_prompt_length: 1800, max_length: 2048}
    dataset: true
producer: {type: listwise, pad_groups_to: 2}
teacher: {provider: none, input: same}
loss:
  terms:
    - {criterion: ppd, weight: 1.0, params: {beta: 10.0, exact_ranking_limit: 8}}
train: {output_dir: outputs/preference/ppd, batch_size: 64, micro_batch_size: 2}
optim: {lr: 8e-7}
callbacks:
  - type: evaluate
    every: epoch
    load_best_at_end: true
  - type: checkpoint
    every: epoch
    keep_best: 1
    metric: dev_loss/loss
    mode: min
eval:
  - type: dev_loss
    when: epoch
    data:
      type: hf_dataset
      path: HuggingFaceH4/ultrafeedback_binarized
      split: test_prefs
      limit: 200
  - type: lm_eval
    when: end
    name: preference
    tasks:
      - hellaswag
      - arc_challenge
      - truthfulqa_mc2
      - winogrande
      - gsm8k
    batch_size: auto

