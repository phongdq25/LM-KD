name: csd_on_policy_qwen3_0.6b_from_4b
models:
  student:
    path: Qwen/Qwen3-0.6B
    dtype: bf16
    task: causal_lm
    lora:
      r: 8
      lora_alpha: 64
      lora_dropout: 0.1
      target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  teacher:
    path: Qwen/Qwen3-4B-Instruct-2507
    dtype: bf16
    task: causal_lm
    placement: same_device
data:
  train:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/train.jsonl
  eval:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/dev.jsonl
  transforms:
  - type: tokenize_sft
    use_chat_template: true
    chat_template_kwargs:
      enable_thinking: false
  max_length: 1024
  padding: dynamic
  pad_to_multiple_of: 8
teacher:
  provider: hf_frozen
  input: same
producer:
  type: adaptive_sgo
  init_threshold: 0.0
  schedule: decreasing
  capacity: 1000
  sampling:
    temperature: 0.5
    top_p: 1.0
    top_k: -1
rollout:
  type: vllm_colocate
  gpu_memory_utilization: 0.3
  lora_mode: hot_load
algorithm: standard
step:
  type: standard
loss:
  aggregator:
    type: kd_mix
    kd_ratio: 1.0
    ce_alias: nll
  terms:
  - criterion: nll
  - criterion: token_kd
    alias: kd
    params:
      divergence: csd
      chunk_size: 1024
optim:
  lr: 2.0e-05
  weight_decay: 0.0
  groups:
  - name: no_decay
    match:
      ndim_le: 1
    weight_decay: 0.0
  - name: default
    match: {}
  optimizers:
    default:
      type: adamw
  schedulers:
  - type: cosine
    warmup_ratio: 0.03
    min_lr_ratio: 0.1
grad:
  clip_norm: 1.0
engine:
  type: local
  device: auto
  mixed_precision: bf16
callbacks:
- type: evaluate
  every: epoch
  at_start: true
  load_best_at_end: true
- type: checkpoint
  every: epoch
  keep_best: 1
  metric: dev_loss/loss
  mode: min
eval:
- type: dev_loss
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/dev.jsonl
  when: epoch
- type: generation_rouge
  name: dolly
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/valid.jsonl
  when: end
- type: generation_rouge
  name: self_inst
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/self-inst/valid.jsonl
  when: end
- type: generation_rouge
  name: vicuna
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/vicuna/valid.jsonl
  when: end
- type: generation_rouge
  name: sinst
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/sinst/11_/valid.jsonl
  when: end
train:
  output_dir: outputs/csd_on_policy
  epochs: 3
  batch_size: 32
  micro_batch_size: 4
  seed: 42
  log_every: 10
