name: distillm2_qwen3_0.6b_from_4b

models:
  student:
    path: Qwen/Qwen3-0.6B
    dtype: bf16
    task: causal_lm
  teacher:
    path: Qwen/Qwen3-4B-Instruct-2507
    dtype: bf16
    task: causal_lm
    placement: same_device

data:
  train:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/train.jsonl
  eval:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/dev.jsonl
  transforms:
    - type: tokenize_sft
      use_chat_template: true
      chat_template_kwargs:
        enable_thinking: false
  max_length: 256
  padding: dynamic
  pad_to_multiple_of: 8

teacher:
  provider: hf_frozen
  input: same

producer:
  type: distillm2
  sampling:
    temperature: 0.8
    top_p: 1.0
    max_new_tokens: 512

rollout:
  type: vllm_colocate
  gpu_memory_utilization: 0.3

algorithm: standard

step:
  type: standard

loss:
  terms:
    - criterion: distillm2
      alias: distillm2
      weight: 1.0
      params:
        beta: 1.0
        base_alpha_1: 0.1
        base_alpha_2: 0.1
        update_alpha: false
        gradual_beta: false
        average_log_prob: true
        reduction: mean

optim:
  lr: 2.0e-5
  weight_decay: 0.0
  groups:
    - name: no_decay
      match:
        ndim_le: 1
      weight_decay: 0.0
    - name: default
      match: {}
  optimizers:
    default:
      type: adamw
  schedulers:
    - type: cosine
      warmup_ratio: 0.03
      min_lr_ratio: 0.1

grad:
  clip_norm: 1.0

engine:
  type: local
  device: auto
  mixed_precision: bf16

callbacks:
  - type: evaluate
    every: epoch
    at_start: true
    load_best_at_end: true
  - type: checkpoint
    every: epoch
    keep_best: 1
    metric: dev_loss/loss
    mode: min

eval:
  - type: dev_loss
    data:
      type: jsonl
      path: datasets/same_cross_tokenizer_data/dolly/dev.jsonl
    when: epoch
  - type: generation_rouge
    name: dolly
    data:
      type: jsonl
      path: datasets/same_cross_tokenizer_data/dolly/valid.jsonl
    use_chat_template: true
    chat_template_kwargs:
      enable_thinking: false
    when: end
  - type: generation_rouge
    name: self_inst
    data:
      type: jsonl
      path: datasets/same_cross_tokenizer_data/self-inst/valid.jsonl
    use_chat_template: true
    chat_template_kwargs:
      enable_thinking: false
    when: end
  - type: generation_rouge
    name: vicuna
    data:
      type: jsonl
      path: datasets/same_cross_tokenizer_data/vicuna/valid.jsonl
    use_chat_template: true
    chat_template_kwargs:
      enable_thinking: false
    when: end

train:
  output_dir: outputs/distillm2
  epochs: 5
  batch_size: 8
  micro_batch_size: 4
  seed: 42
  log_every: 10
