# Off-policy token-level KD, same tokenizer (DistiLLM family).
name: fkl_qwen3_0.6b_from_4b

models:
  student:
    path: Qwen/Qwen3-0.6B
    dtype: bf16
    task: causal_lm
  teacher:
    path: Qwen/Qwen3-4B-Instruct-2507
    dtype: bf16
    task: causal_lm
    placement: same_device

data:
  train:
    type: jsonl
    path: data/train.jsonl
  transforms:
    - type: tokenize_sft
      use_chat_template: true
      chat_template_kwargs: {enable_thinking: false}
  max_length: 1024
  padding: dynamic
  pad_to_multiple_of: 8

teacher:
  provider: hf_frozen
  input: same

producer:
  type: dataset

algorithm: standard
step:
  type: standard

loss:
  aggregator:
    type: kd_mix
    kd_ratio: 1.0
    ce_alias: nll
  terms:
    - criterion: nll
    - criterion: token_kd
      alias: kd
      params:
        divergence: fkl
        chunk_size: 1024

optim:
  lr: 2.0e-5
  weight_decay: 0.0
  groups:
    - name: no_decay
      match: {ndim_le: 1}
      weight_decay: 0.0
    - name: default
      match: {}
  optimizers:
    default:
      type: adamw
  schedulers:
    - type: cosine
      warmup_ratio: 0.03
      min_lr_ratio: 0.1

grad:
  clip_norm: 1.0

engine:
  type: local
  device: auto
  mixed_precision: bf16

callbacks:
  - type: evaluate
    every: epoch

eval:
  - type: dev_loss
    data: {type: jsonl, path: data/dev.jsonl}
  - type: generation_rouge
    data: {type: jsonl, path: data/dev.jsonl}

train:
  output_dir: outputs/fkl
  epochs: 3
  batch_size: 32
  micro_batch_size: 4
  seed: 42
  log_every: 10
