# SFT baseline (same-tokenizer family). Replace paths, then:
#   lmkd check -c recipes/same_tokenizer/sft.yaml
#   lmkd train -c recipes/same_tokenizer/sft.yaml --set train.max_steps=100
name: sft_qwen3_0.6b

models:
  student:
    path: Qwen/Qwen3-0.6B
    dtype: bf16
    task: causal_lm

data:
  train:
    type: jsonl
    path: data/train.jsonl       # {prompt, response}
  transforms:
    - type: tokenize_sft
      use_chat_template: true
      chat_template_kwargs: {enable_thinking: false}
  max_length: 1024
  padding: dynamic
  pad_to_multiple_of: 8

producer:
  type: dataset

algorithm: standard
step:
  type: standard

loss:
  terms:
    - criterion: nll

optim:
  lr: 2.0e-5
  weight_decay: 0.0
  groups:
    - name: no_decay
      match: {ndim_le: 1}
      weight_decay: 0.0
    - name: default
      match: {}
  optimizers:
    default:
      type: adamw
  schedulers:
    - type: cosine
      warmup_ratio: 0.03
      min_lr_ratio: 0.1

grad:
  clip_norm: 1.0

engine:
  type: local
  device: auto
  mixed_precision: bf16

train:
  output_dir: outputs/sft
  epochs: 3
  batch_size: 32
  micro_batch_size: 4
  seed: 42
  log_every: 10
