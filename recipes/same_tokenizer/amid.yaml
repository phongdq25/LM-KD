name: amid_qwen3_0.6b_from_4b
models:
  student:
    path: Qwen/Qwen3-0.6B
    dtype: bf16
    task: causal_lm
  teacher:
    path: Qwen/Qwen3-4B-Instruct-2507
    dtype: bf16
    task: causal_lm
    placement: same_device
data:
  train:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/train.jsonl
  eval:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/dev.jsonl
  transforms:
  - type: tokenize_sft
    use_chat_template: true
    chat_template_kwargs:
      enable_thinking: false
  max_length: 256
  padding: dynamic
  pad_to_multiple_of: 8
teacher:
  provider: hf_frozen
  input: same
producer:
  type: dataset
rollout:
  type: vllm_colocate
  gpu_memory_utilization: 0.3
algorithm: standard
step:
  type: standard
loss:
  aggregator:
    type: kd_mix
    kd_ratio: 1.0
    ce_alias: nll
  terms:
  - criterion: nll
  - criterion: token_kd
    alias: kd
    params:
      divergence: amid
      amid_alpha: 0.5
      amid_lam: 0.5
      amid_div_name: ab
      amid_div_order: pr
      ab_alpha: 0.5
      ab_beta: 0.5
      temperature: 1.0
      chunk_size: 1024
optim:
  lr: 2.0e-05
  weight_decay: 0.0
  groups:
  - name: no_decay
    match:
      ndim_le: 1
    weight_decay: 0.0
  - name: default
    match: {}
  optimizers:
    default:
      type: adamw
  schedulers:
  - type: cosine
    warmup_ratio: 0.03
    min_lr_ratio: 0.1
grad:
  clip_norm: 1.0
engine:
  type: local
  device: auto
  mixed_precision: bf16
callbacks:
- type: evaluate
  every: epoch
  load_best_at_end: true
- type: checkpoint
  every: epoch
  keep_best: 1
  metric: dev_loss/loss
  mode: min
eval:
- type: dev_loss
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/dev.jsonl
  when: epoch
- type: generation_rouge
  name: dolly
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/valid.jsonl
  when: end
- type: generation_rouge
  name: self_inst
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/self-inst/valid.jsonl
  when: end
- type: generation_rouge
  name: vicuna
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/vicuna/valid.jsonl
  when: end
- type: generation_rouge
  name: sinst
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/sinst/11_/valid.jsonl
  when: end
train:
  output_dir: outputs/amid
  epochs: 5
  batch_size: 32
  micro_batch_size: 4
  seed: 42
  log_every: 10
