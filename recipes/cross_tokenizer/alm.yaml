name: alm_gpt2_from_qwen
models:
  student:
    path: openai-community/gpt2
    dtype: bf16
    task: causal_lm
    gradient_checkpointing: false
    trainable: true
    placement: same_device
    trust_remote_code: false
  teacher:
    path: Qwen/Qwen2.5-1.5B-Instruct
    dtype: bf16
    task: causal_lm
    gradient_checkpointing: false
    trainable: true
    placement: same_device
    trust_remote_code: false
data:
  train:
    type: jsonl
    path: data/train.jsonl
  transforms:
  - type: tokenize_sft
    use_chat_template: false
    teacher: true
    teacher_prompt_text: same
  - type: load_vocab_map
    space_mask_mode: space+tab+newline+special
    student_byteify: openai-community/gpt2:source=GPT2
    teacher_byteify: Qwen/Qwen2.5-1.5B-Instruct:source=Qwen2
  - type: align
    aligner:
      type: tokenkit_chunk
      alignment: unconstrained
      exclude_last: true
      student_byteify: openai-community/gpt2:source=GPT2
      teacher_byteify: Qwen/Qwen2.5-1.5B-Instruct:source=Qwen2
  max_length: 1024
  padding: dynamic
  pad_to_multiple_of: 8
  packing: false
  num_workers: 0
  pin_memory: true
teacher:
  provider: hf_frozen
  input: pretokenized
loss:
  aggregator:
    type: gradmag
    mode: approx_gradmag_preserve_mag
  terms:
  - criterion: nll
    weight: 1.0
    alias: nll
    params: {}
  - criterion: alm
    weight: 1.0
    alias: alm
    params:
      binarization_temp: 100.0
      bias_threshold: 0.1
      mode: merge_by_space_prob+append_space
  schedules: {}
producer:
  type: dataset
algorithm: standard
step:
  type: multi_objective_grad
  combine: gradmag
  grad_params: last_block
optim:
  groups:
  - name: no_decay
    match:
      ndim_le: 1
    weight_decay: 0.0
  - name: default
    match: {}
  optimizers:
    default:
      type: adamw
  lr: 2.0e-05
  weight_decay: 0.0
  schedulers:
  - type: cosine
    warmup_ratio: 0.03
    min_lr_ratio: 0.1
grad:
  clip_norm: 1.0
  hooks: []
  transforms: []
engine:
  type: local
  device: auto
  mixed_precision: bf16
train:
  output_dir: outputs/alm
  epochs: 1.0
  batch_size: 32
  micro_batch_size: 4
  seed: 42
  log_every: 10
  save: {}
