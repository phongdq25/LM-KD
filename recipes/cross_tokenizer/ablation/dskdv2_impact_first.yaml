# DSKDv2 + IMPACT layer-mapper ablation; only layer_mapper differs from the parent recipe.
_base_: ../dskdv2_impact.yaml
name: dskdv2_eta_impact_first_gpt2_from_qwen
loss:
  terms:
    - {criterion: nll, alias: nll, weight: 0.15}
    - {criterion: dskdv2_eta, alias: kd, weight: 0.85, params: {temperature: 2.5, kd_objective: skewed_forward_kl}}
    - {criterion: impact, alias: impact, weight: 2.0, params: {lambda_reg: 2.0, layer_mapper: {type: first, k: 10, tau: 2.0}}}
train: {output_dir: outputs/dskdv2_eta_impact_first, epochs: 1, batch_size: 32, micro_batch_size: 4}
