name: residualkd_stage1
models:
  student:
    path: Qwen/Qwen2.5-1.5B-Instruct
    dtype: bf16
    task: causal_lm
    gradient_checkpointing: false
    trainable: false
    placement: same_device
    trust_remote_code: false
data:
  train:
    type: jsonl
    path: data/train.jsonl
  transforms:
  - type: tokenize_sft
    use_chat_template: false
  max_length: 1024
  padding: dynamic
  pad_to_multiple_of: 8
  packing: false
  num_workers: 0
  pin_memory: true
teacher:
  provider: none
  input: same
loss:
  aggregator: weighted_sum
  terms:
  - criterion: residual_pretrain
    weight: 1.0
    params:
      d_bottleneck: 64
  schedules: {}
producer:
  type: dataset
algorithm: standard
step:
  type: standard
optim:
  groups:
  - name: projector
    match:
      group: projector
    lr: 0.001
  - name: default
    match: {}
  optimizers:
    default:
      type: adamw
  lr: 0.001
  weight_decay: 0.0
  schedulers:
  - type: cosine
    warmup_ratio: 0.03
    min_lr_ratio: 0.1
grad:
  clip_norm: 1.0
  hooks: []
  transforms: []
engine:
  type: local
  device: auto
  mixed_precision: bf16
train:
  output_dir: outputs/residualkd/stage1
  epochs: 1.0
  batch_size: 32
  micro_batch_size: 4
  seed: 42
  log_every: 10
  save: {}
