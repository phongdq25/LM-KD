name: mcw_kd_gpt2_from_qwen
models:
  student:
    path: openai-community/gpt2
    dtype: bf16
    task: causal_lm
    gradient_checkpointing: false
    trainable: true
    placement: same_device
    trust_remote_code: false
  teacher:
    path: Qwen/Qwen2.5-1.5B-Instruct
    dtype: bf16
    task: causal_lm
    gradient_checkpointing: false
    trainable: true
    placement: same_device
    trust_remote_code: false
data:
  train:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/train.jsonl
  eval:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/dev.jsonl
  transforms:
  - type: tokenize_sft
    use_chat_template: false
    teacher: true
    teacher_prompt_text: same
  - type: load_vocab_map
    cache_path: outputs/xtok/vocab_map.pt
  - type: align
    aligner:
      type: dtw_edit
      full_sequence: true
  max_length: 256
  padding: dynamic
  pad_to_multiple_of: 8
  packing: false
  num_workers: 0
  pin_memory: true
teacher:
  provider: hf_frozen
  input: pretokenized
loss:
  aggregator:
    type: weighted_sum
  terms:
  - criterion: nll
    weight: 1.0
    params: {}
  - criterion: dskd_cma
    weight: 5.0
    alias: cma
    params:
      temperature: 3.0
      kd_objective: forward_kl
  - criterion: ot_logits
    weight: 1.0
    params:
      top_k_vocab: 400
  - criterion: ot_hidden
    weight: 1.0
    params: {}
  schedules: {}
producer:
  type: dataset
rollout:
  type: vllm_colocate
  gpu_memory_utilization: 0.3
algorithm: standard
step:
  type: standard
optim:
  groups:
  - name: projector
    match:
      group: projector
    lr: 0.001
  - name: default
    match: {}
  optimizers:
    default:
      type: adamw
  lr: 2.0e-05
  weight_decay: 0.0
  schedulers:
  - type: cosine
    warmup_ratio: 0.03
    min_lr_ratio: 0.1
grad:
  clip_norm: 1.0
  hooks: []
  transforms: []
engine:
  type: local
  device: auto
  mixed_precision: bf16
train:
  output_dir: outputs/mcw_kd
  epochs: 20.0
  batch_size: 32
  micro_batch_size: 4
  seed: 42
  log_every: 10
  save: {}
callbacks:
- type: evaluate
  every: epoch
  load_best_at_end: true
- type: checkpoint
  every: epoch
  keep_best: 1
  metric: dev_loss/loss
  mode: min
eval:
- type: dev_loss
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/dev.jsonl
  when: epoch
- type: generation_rouge
  name: dolly
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/dolly/valid.jsonl
  when: end
- type: generation_rouge
  name: self_inst
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/self-inst/valid.jsonl
  when: end
- type: generation_rouge
  name: vicuna
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/vicuna/valid.jsonl
  when: end
- type: generation_rouge
  name: sinst
  data:
    type: jsonl
    path: datasets/same_cross_tokenizer_data/sinst/11_/valid.jsonl
  when: end
