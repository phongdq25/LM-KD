<rect x="125" y="11.5" width="98" height="9" fill="#EAF2FA" stroke="#526575" stroke-width="0.3"/>
<text x="127" y="15.22" text-anchor="start" font-size="2.85">Seq-KD, Fine-tune-CoT, SCOTT, ALM, LEAF,</text>
<text x="127" y="18.78" text-anchor="start" font-size="2.85">KARD, Distilling Step-by-Step, TAID, ADPA</text>
<rect x="12" y="30" width="56" height="6" fill="#EAF5ED" stroke="#526575" stroke-width="0.3"/>
<text x="40.0" y="34.09" text-anchor="middle" font-size="3.1" font-weight="700">Current-policy supervision</text>
<rect x="72" y="23.5" width="49" height="9" fill="#EAF5ED" stroke="#526575" stroke-width="0.3"/>
<text x="74" y="27.18" text-anchor="start" font-size="3.0">Non-interactive</text>
<text x="74" y="30.93" text-anchor="start" font-size="3.0">rollouts</text>
<rect x="125" y="23.5" width="98" height="9" fill="#EAF5ED" stroke="#526575" stroke-width="0.3"/>
<text x="127" y="27.22" text-anchor="start" font-size="2.85">GKD, f-DISTILL, SDFT, OPHSD, OPD+,</text>
<text x="127" y="30.78" text-anchor="start" font-size="2.85">SimCT, Prune-OPD, FOPD, SEAD, TSD-KD</text>
<rect x="72" y="33.5" width="49" height="9" fill="#EAF5ED" stroke="#526575" stroke-width="0.3"/>
<text x="74" y="37.17" text-anchor="start" font-size="3.0">Environment-interactive</text>
<text x="74" y="40.92" text-anchor="start" font-size="3.0">rollouts</text>
<rect x="125" y="33.5" width="98" height="9" fill="#EAF5ED" stroke="#526575" stroke-width="0.3"/>
<text x="127" y="37.22" text-anchor="start" font-size="2.85">TurnOPD, Skill-SD, HINT-SD, StepOPSD,</text>
<text x="127" y="40.78" text-anchor="start" font-size="2.85">SD-Search, SSPO, CNY, CHOP, OSPD</text>
<rect x="12" y="52" width="56" height="6" fill="#FFF2DC" stroke="#526575" stroke-width="0.3"/>
