<rect x="72" y="45.5" width="49" height="9" fill="#FFF2DC" stroke="#526575" stroke-width="0.3"/>
<text x="74" y="49.17" text-anchor="start" font-size="3.0">Data from a fixed</text>
<text x="74" y="52.92" text-anchor="start" font-size="3.0">student checkpoint</text>
<rect x="125" y="45.5" width="98" height="9" fill="#FFF2DC" stroke="#526575" stroke-width="0.3"/>
<text x="127" y="49.22" text-anchor="start" font-size="2.85">Semi-OPD, AllMem, Lightning OPD 2.0, LWD,</text>
<text x="127" y="52.78" text-anchor="start" font-size="2.85">daDPO, ORPO-Distill, PLaD, QDPO, LEAFE</text>
<rect x="72" y="55.5" width="49" height="9" fill="#FFF2DC" stroke="#526575" stroke-width="0.3"/>
<text x="74" y="59.17" text-anchor="start" font-size="3.0">Data from multiple</text>
<text x="74" y="62.92" text-anchor="start" font-size="3.0">student checkpoints</text>
<rect x="125" y="55.5" width="98" height="9" fill="#FFF2DC" stroke="#526575" stroke-width="0.3"/>
<text x="127" y="59.22" text-anchor="start" font-size="2.85">DistiLLM, SPIN, T-SPIN, SPPO, Open-MOPD,</text>
<text x="127" y="62.78" text-anchor="start" font-size="2.85">SWIFT, SDPO, ReSAIL, AsyncOPD, DivOPD</text>
<rect x="12" y="79" width="56" height="6" fill="#F2ECF8" stroke="#526575" stroke-width="0.3"/>
<text x="40.0" y="83.08" text-anchor="middle" font-size="3.1" font-weight="700">Mixed-policy supervision</text>
<rect x="72" y="67.5" width="49" height="9" fill="#F2ECF8" stroke="#526575" stroke-width="0.3"/>
<text x="74" y="71.17" text-anchor="start" font-size="3.0">Mixing examples from</text>
<text x="74" y="74.92" text-anchor="start" font-size="3.0">different sources</text>
<rect x="125" y="67.5" width="98" height="9" fill="#F2ECF8" stroke="#526575" stroke-width="0.3"/>
<text x="127" y="71.22" text-anchor="start" font-size="2.85">ImitKD, GKD, DistiLLM, DistillSpec, AMiD,</text>
<text x="127" y="74.78" text-anchor="start" font-size="2.85">DistiLLM-2, CSD, LUFFY, ProD, MTA</text>
<rect x="72" y="77.5" width="49" height="9" fill="#F2ECF8" stroke="#526575" stroke-width="0.3"/>
<text x="74" y="81.17" text-anchor="start" font-size="3.0">Mixing sources within a</text>
<text x="74" y="84.92" text-anchor="start" font-size="3.0">generation history</text>
<rect x="125" y="77.5" width="98" height="9" fill="#F2ECF8" stroke="#526575" stroke-width="0.3"/>
<text x="127" y="81.22" text-anchor="start" font-size="2.85">MiniLLM, SKD, IPD, Guided-OPD, CoTD-PO,</text>
<text x="127" y="84.78" text-anchor="start" font-size="2.85">A Few Teacher Steps, STI-OPD, ReOPD, P-ALIGN</text>
<rect x="72" y="87.5" width="49" height="9" fill="#F2ECF8" stroke="#526575" stroke-width="0.3"/>
<text x="74" y="91.17" text-anchor="start" font-size="3.0">Switching sources across</text>
<text x="74" y="94.92" text-anchor="start" font-size="3.0">training stages</text>
<rect x="125" y="87.5" width="98" height="9" fill="#F2ECF8" stroke="#526575" stroke-width="0.3"/>
<text x="127" y="91.22" text-anchor="start" font-size="2.85">GKD, DistillSpec, Lightning OPD, GAD,</text>
<text x="127" y="94.78" text-anchor="start" font-size="2.85">Qwen3, HPD, DGPO, Beyond GRPO and OPD</text>
